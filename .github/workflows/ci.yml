name: CI / Quality & Drift Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Repository Essentials
        run: |
          echo "Checking essential hackathon files..."
          test -f HACKATHON.md || { echo "Missing HACKATHON.md"; exit 1; }
          test -f LICENSE || { echo "Missing LICENSE"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          echo "Essential files present."

      - name: Scan for Leaked Secrets
        run: |
          echo "Checking for accidental secret patterns..."
          if grep -r -E "ghp_[A-Za-z0-9]{36}|AIza[0-9A-Za-z-_]{35}|sk-[a-zA-Z0-9]{48}" . \
            --exclude-dir={.git,.github} --exclude=*.md; then
            echo "Potential secret found! Aborting PR build."
            exit 1
          fi
          echo "Secret scan passed cleanly."

  test-and-coverage:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov ruff || true

      - name: Run Unit Tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --cov=. --cov-report=term-missing || true
          else
            echo "No tests directory yet; will be added in upcoming PR."
          fi
