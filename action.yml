name: 'DocDrift Documentation Drift Detector'
description: 'Automatically detects when code changes, but markdown documentation is left outdated in Pull Requests.'
author: 'BIG 4 (Saksham Bist, Kushal Singla, Krrish Raj, Rudra Sharma)'
branding:
  icon: 'file-text'
  color: 'purple'

inputs:
  code-path:
    description: 'Path to Python codebase or file to analyze'
    required: false
    default: '.'
  docs-path:
    description: 'Path to markdown documentation file or folder'
    required: false
    default: 'README.md'
  diff:
    description: 'Git diff range (e.g. HEAD~1 or origin/main...HEAD) to only analyze symbols modified in PR'
    required: false
    default: ''
  format:
    description: 'Output format (text, markdown, json)'
    required: false
    default: 'markdown'
  fail-on-breaking:
    description: 'Whether to exit with code 1 if breaking drift is detected'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install DocDrift
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Run DocDrift Guard
      shell: bash
      run: |
        DIFF_FLAG=""
        if [ -n "${{ inputs.diff }}" ]; then
          DIFF_FLAG="--diff ${{ inputs.diff }}"
        fi

        FAIL_FLAG=""
        if [ "${{ inputs.fail-on-breaking }}" = "true" ]; then
          FAIL_FLAG="--fail-on-breaking"
        fi

        docdrift check \
          --code "${{ inputs.code-path }}" \
          --docs "${{ inputs.docs-path }}" \
          --format "${{ inputs.format }}" \
          $DIFF_FLAG $FAIL_FLAG
